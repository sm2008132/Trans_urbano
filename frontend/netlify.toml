[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  VITE_API_URL = "https://transurbano-backend.onrender.com"
  VITE_SOCKET_URL = "https://transurbano-backend.onrender.com"

[context.development.environment]
  VITE_API_URL = "http://localhost:3000"
  VITE_SOCKET_URL = "http://localhost:3000"
